<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Gia Phả Nguyễn Hữu</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* VOICE  quiet and modern: a family register anyone can use
   IDEA   a clean printed pedigree chart, black ink on white paper
   PICTURE the top-down family chart itself, opened on the living branch
   COLOUR white, near-black ink, three greys; solid black marks the selected person, a heavy outline the direct line
   TYPE   Inter for everything, weight for hierarchy
   LAYOUT slim header with VI | EN at top right; title and figures; chart with detail panel beside it (bottom sheet on phones) */
:root{color-scheme:light dark;--bg:light-dark(#ffffff,#0e0e0e);--ink:light-dark(#111111,#f1f1f1);--mute:light-dark(#6b6b6b,#a0a0a0);--line:light-dark(#dcdcdc,#333333);--soft:light-dark(#f5f5f5,#171717);--card:light-dark(#ffffff,#141414)}
:root[data-theme=light]{color-scheme:light}
:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html{scroll-padding-top:70px}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 Inter,system-ui,sans-serif;overflow-x:clip}
h1,h2,h3{margin:0;letter-spacing:-.02em;line-height:1.08;text-wrap:balance}
h1{font-size:clamp(34px,5.5vw,52px);font-weight:700}
h2{font-size:clamp(26px,3.5vw,34px);font-weight:700}
a{color:var(--ink)}
button{font:inherit;color:inherit}
.band{padding:clamp(28px,4vw,56px) max(5vw,16px)}
.wrap{max-width:1240px;margin:0 auto}
.soft{background:var(--soft)}
header.bar{position:sticky;top:0;z-index:10;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:0 max(5vw,16px)}
.barin{max-width:1240px;margin:0 auto;display:flex;align-items:center;gap:8px 20px;min-height:58px;flex-wrap:wrap}
.brand{font-weight:700}
.bar nav{display:flex;flex-wrap:wrap;gap:0 18px;flex:1}
.bar nav a{text-decoration:none;color:var(--mute);padding:8px 0;font-size:15px}
.bar nav a:hover{color:var(--ink)}
.lang{display:flex;border:1px solid var(--line);border-radius:999px;padding:3px;margin-left:auto}
.lang button{border:0;background:none;border-radius:999px;padding:6px 14px;min-height:36px;cursor:pointer;font-weight:600;font-size:14px;color:var(--mute)}
.lang button[aria-pressed=true]{background:var(--ink);color:var(--bg)}
.hero{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:24px 56px;align-items:end}
.hero p{color:var(--mute);font-size:17px;max-width:58ch;margin:14px 0 0}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;border-top:1px solid var(--line);padding-top:14px}
.stats b{display:block;font-size:clamp(28px,4vw,40px);line-height:1.1;font-weight:700}
.stats span{font-size:14px;color:var(--mute)}
.cta{min-height:46px;padding:0 22px;border:0;border-radius:999px;background:var(--ink);color:var(--bg);font-weight:600;cursor:pointer;margin-top:20px}
.cta:hover{opacity:.85}
.fig{position:relative;height:190px;margin-top:28px}
.fig>svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.cap{font-size:13px;color:var(--mute);margin:4px 0 0}
.intro{color:var(--mute);max-width:70ch;margin:8px 0 18px}
.tools{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:12px}
.search{position:relative;flex:1 1 240px;max-width:380px}
input,select,textarea{font:16px Inter,system-ui,sans-serif;color:var(--ink)}
.search input,.sel{width:100%;padding:10px 14px;min-height:44px;border:1px solid var(--line);border-radius:8px;background:var(--bg)}
.sel{width:auto}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.hits{position:absolute;z-index:6;left:0;right:0;top:calc(100% + 4px);background:var(--bg);border:1px solid var(--line);border-radius:8px;max-height:320px;overflow:auto;box-shadow:0 10px 30px #0002}
.hits button,.pick button{display:block;width:100%;text-align:left;border:0;background:none;padding:10px 14px;cursor:pointer;min-height:44px}
.hits button:hover,.pick button:hover{background:var(--soft)}
.hits small,.pick small{color:var(--mute)}
.btn{min-height:44px;padding:0 16px;border:1px solid var(--line);border-radius:8px;background:var(--bg);cursor:pointer}
.btn:hover{border-color:var(--ink)}
.btn.main{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.zb{width:44px;padding:0;font-size:18px}
.grid{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:18px;align-items:start}
.chartwrap{border:1px solid var(--line);border-radius:12px;background:var(--soft);height:min(74vh,760px);overflow:auto;cursor:grab;touch-action:pan-x pan-y}
.chartwrap.drag{cursor:grabbing;user-select:none}
.chart{padding:28px;min-width:max-content}
.chart ul{display:flex;justify-content:center;margin:0;padding:20px 0 0;position:relative}
.chart>ul{padding-top:0}
.chart li{list-style:none;text-align:center;position:relative;padding:20px 5px 0;display:flex;flex-direction:column;align-items:center}
.chart li::before,.chart li::after{content:"";position:absolute;top:0;right:50%;border-top:2px solid var(--line);width:50%;height:20px}
.chart li::after{right:auto;left:50%;border-left:2px solid var(--line)}
.chart li:only-child::before,.chart li:only-child::after{display:none}
.chart li:only-child{padding-top:0}
.chart li:first-child::before,.chart li:last-child::after{border:0 none}
.chart li:last-child::before{border-right:2px solid var(--line);border-radius:0 6px 0 0}
.chart li:first-child::after{border-radius:6px 0 0 0}
.chart ul ul::before{content:"";position:absolute;top:0;left:50%;border-left:2px solid var(--line);height:20px}
.chart>ul>li{padding-top:0}
.chart>ul>li::before,.chart>ul>li::after{display:none}
.node{display:flex;flex-direction:column;align-items:center}
.box{position:relative;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:7px 12px;font-size:14px;line-height:1.3;white-space:nowrap;cursor:pointer;max-width:200px;overflow:hidden;text-overflow:ellipsis}
.box small{display:block;color:var(--mute);font-size:12px}
.box:hover{border-color:var(--ink)}
.box.dl{border:2px solid var(--ink);font-weight:600}
.box.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.box.on small{color:var(--bg);opacity:.75}
.box .ci{position:absolute;top:4px;right:4px;width:7px;height:7px;border-radius:50%;background:currentColor}
.box .nw{font-size:11px;color:var(--mute)}
.tgl{margin-top:4px;border:1px solid var(--line);background:var(--bg);border-radius:999px;font-size:12px;padding:0 9px;min-height:24px;cursor:pointer;color:var(--mute)}
.tgl:hover{border-color:var(--ink);color:var(--ink)}
.panel{position:sticky;top:76px;border:1px solid var(--line);border-radius:12px;padding:20px;background:var(--bg);max-height:calc(100vh - 96px);overflow:auto}
.panel h3{font-size:24px}
.panel .x{display:none}
dl.kv{display:grid;grid-template-columns:auto minmax(0,1fr);gap:6px 14px;margin:14px 0 0}
dl.kv dt{color:var(--mute);font-size:14px}
dl.kv dd{margin:0;overflow-wrap:anywhere}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);border-radius:999px;background:var(--bg);padding:4px 12px;min-height:34px;cursor:pointer;font-size:14px}
.chip:hover{border-color:var(--ink)}
.note{margin-top:12px;font-size:15px}
.contact{margin-top:16px;border-top:1px solid var(--line);padding-top:14px}
.contact h4{margin:0;font-size:15px}
.acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.acts .btn{min-height:40px;font-size:15px}
.muted{color:var(--mute);font-size:14px}
.chain{font-size:14px;color:var(--mute);margin-top:14px;border-top:1px solid var(--line);padding-top:12px}
.chain button{border:0;background:none;padding:0;text-decoration:underline;cursor:pointer;font-size:14px}
.dir{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px;margin-top:16px}
.pc{border:1px solid var(--line);border-radius:10px;padding:16px;background:var(--bg)}
.pc h3{font-size:18px}
.pc .meta{font-size:14px;color:var(--mute);margin:4px 0 8px}
.pc .ln{font-size:15px;overflow-wrap:anywhere}
.status{padding:12px 16px;border-radius:8px;border:1px solid var(--line);background:var(--bg);margin-top:12px;font-size:15px}
.people{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:28px;margin-top:22px}
.card h3{font-size:20px}
.card .y{color:var(--mute);font-size:14px;margin:4px 0 8px}
.card p{margin:0 0 10px}
.route{list-style:none;padding:0;margin:22px 0 0;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:22px 26px;counter-reset:r}
.route li{border-top:2px solid var(--ink);padding-top:10px}
.route b{display:block;font-size:17px}
.route span{display:block;font-size:14px;color:var(--mute)}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:28px 48px;margin-top:28px}
blockquote{margin:0;padding:4px 0 4px 18px;border-left:3px solid var(--ink);font-size:19px;line-height:1.45;font-weight:500}
blockquote footer{font-size:14px;font-weight:400;color:var(--mute);margin-top:8px}
ul.plain li{margin-bottom:8px}
ul.plain{padding-left:18px}
.src li{overflow-wrap:anywhere}
footer.foot{border-top:1px solid var(--line);color:var(--mute);font-size:14px}
dialog{border:0;border-radius:14px;padding:0;width:min(560px,calc(100vw - 24px));max-height:calc(100vh - 32px);background:var(--bg);color:var(--ink);box-shadow:0 20px 60px #0005}
dialog::backdrop{background:#0008}
.dlg{padding:22px;overflow:auto;max-height:calc(100vh - 32px);position:relative}
.dlg h3{font-size:24px;margin-bottom:4px;padding-right:44px}
.x2{position:absolute;right:12px;top:12px;width:44px;height:44px;border:0;border-radius:50%;background:var(--soft);cursor:pointer}
.fg{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px 14px;margin-top:14px}
.fg .w{grid-column:1/-1}
.fg label{display:block;font-size:14px;font-weight:500}
.fg input,.fg select,.fg textarea{width:100%;margin-top:4px;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg)}
.fg textarea{min-height:70px;resize:vertical}
.ok{display:flex;gap:10px;align-items:flex-start;font-size:14px;margin-top:14px}
.ok input{width:20px;height:20px;margin-top:2px;flex:none}
.err{font-size:14px;min-height:20px;margin-top:8px;font-weight:600}
.pick{max-height:300px;overflow:auto;border:1px solid var(--line);border-radius:8px;margin-top:10px}
textarea.copy{width:100%;min-height:180px;font:14px/1.5 ui-monospace,monospace;margin-top:10px;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--soft)}
.av{display:inline-block;width:40px;height:40px;border-radius:50%;background-color:var(--soft);background-repeat:no-repeat;border:1px solid var(--line);flex:none;vertical-align:middle}
.av.bx{display:block;width:34px;height:34px;margin:0 auto 4px}
.box.on .av{border-color:var(--bg)}
.av.lg{width:56px;height:56px}
.av.xl{display:block;width:88px;height:88px;margin-bottom:10px}
.pc .av{margin-bottom:8px}
.facegrid{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.facebtn{border:0;background:none;padding:0;cursor:pointer;border-radius:50%}
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px;margin-top:14px}
.ph{display:flex;flex-direction:column;text-align:left;border:1px solid var(--line);border-radius:10px;background:var(--bg);padding:0;overflow:hidden;cursor:pointer}
.ph:hover{border-color:var(--ink)}
.phimg{display:block;aspect-ratio:4/3;background:var(--soft)}
.phimg img{width:100%;height:100%;object-fit:cover;display:block}
.phcap{display:flex;flex-direction:column;gap:2px;padding:12px 14px}
dialog.pvd{width:min(1180px,calc(100vw - 24px))}
.pvgrid{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:22px;align-items:start;margin-top:8px}
.pvimgw{min-width:0}
.pvimg{position:relative;width:100%;max-height:72vh;margin:0 auto;background:var(--soft);border-radius:8px;overflow:hidden}
.pvimg img{width:100%;height:100%;display:block;object-fit:contain}
.pvimg.tagging{cursor:crosshair}
.mk{position:absolute;aspect-ratio:1;border:2px solid #fff;border-radius:50%;box-shadow:0 0 0 1.5px #000a,inset 0 0 0 1.5px #000a;pointer-events:auto}
.mk.pend{border-style:dashed}
.mk.foc{border-width:3px;box-shadow:0 0 0 3px #000,0 0 0 6px #fff}
.mkl{position:absolute;top:calc(100% + 4px);left:50%;transform:translateX(-50%);background:#111;color:#fff;font-size:13px;padding:2px 8px;border-radius:999px;white-space:nowrap}
.pvside h3{padding-right:44px}
.hint{font-weight:600}
.tags{display:flex;flex-direction:column;gap:8px}
.trow{display:flex;align-items:center;gap:8px}
.btn.sm{min-height:34px;padding:0 10px}
.btn:disabled{opacity:.4;cursor:default}
dialog.prd{width:min(900px,calc(100vw - 24px))}
.phead{display:flex;gap:18px;align-items:center;padding-right:44px;margin-bottom:18px}
.phead h3{font-size:clamp(24px,4vw,32px);padding-right:0}
.av.xxl{width:104px;height:104px;border-width:2px}
.av.ini{display:grid;place-items:center;font-size:40px;font-weight:700;color:var(--mute)}
.pcols{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px 32px}
.pcols .kv{margin-top:0}
.ph4{margin:26px 0 10px;font-size:17px;border-top:1px solid var(--line);padding-top:16px}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px;align-items:start}
.pth{display:flex;flex-direction:column;text-align:left;border:1px solid var(--line);border-radius:10px;background:var(--bg);padding:0;overflow:hidden;cursor:pointer}
.pth:hover{border-color:var(--ink)}
.pthi{position:relative;display:block;width:100%;background:var(--soft);overflow:hidden}
.pthi img{position:absolute;inset:0;width:100%;height:100%;display:block}
.ring{position:absolute;aspect-ratio:1;border:2px solid #fff;border-radius:50%;box-shadow:0 0 0 2px #000,0 0 0 9999px #0000004d}
.pthc{display:flex;flex-direction:column;gap:2px;padding:10px 12px}
@media(max-width:640px){.pcols{grid-template-columns:minmax(0,1fr)}.av.xxl{width:80px;height:80px}}
@media(max-width:820px){.pvgrid{grid-template-columns:minmax(0,1fr)}}
.linkbtn{border:0;background:none;padding:0;text-decoration:underline;cursor:pointer;color:var(--mute);font-size:14px}
.qimg{width:100%;max-height:180px;object-fit:cover;border-radius:6px;margin-bottom:8px}
@media(max-width:900px){.grid{grid-template-columns:minmax(0,1fr)}.panel{position:fixed;left:0;right:0;bottom:0;top:auto;z-index:20;max-height:62vh;border-radius:16px 16px 0 0;box-shadow:0 -10px 30px #0003;transform:translateY(110%);transition:transform .2s}.panel.on{transform:none}.panel .x{display:grid;position:absolute;right:10px;top:10px;width:44px;height:44px;place-items:center;border:0;background:var(--soft);border-radius:50%;cursor:pointer}.people{grid-template-columns:repeat(2,minmax(0,1fr))}.route{grid-template-columns:repeat(2,minmax(0,1fr))}.hero{grid-template-columns:minmax(0,1fr)}}
@media(max-width:600px){.people,.route,.two,.fg{grid-template-columns:minmax(0,1fr)}.bar nav{order:3;flex-basis:100%;overflow-x:auto;flex-wrap:nowrap}.bar nav a{flex:none}.chart{padding:16px}.chartwrap{height:66vh}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header class="bar" id="top"><div class="barin">
 <div class="brand" data-i="brand"></div>
 <nav><a href="#cay" data-i="navTree"></a><a href="#danh-ba" data-i="navDir"></a><a href="#anh" data-i="navPhotos"></a><a href="#danh-nhan" data-i="navPeople"></a><a href="#nguon-goc" data-i="navOrigin"></a><a href="#tai-lieu" data-i="navSrc"></a></nav>
 <div class="lang" role="group" aria-label="Language"><button id="lvi" aria-pressed="true">VI</button><button id="len" aria-pressed="false">EN</button></div>
</div></header>

<section class="band">
 <div class="wrap">
  <div class="hero">
   <div><h1 data-i="h1"></h1><p data-i="lead"></p><button class="cta" data-start="1" data-i="cta"></button></div>
   <div class="stats" id="stats"></div>
  </div>
  <div class="fig" id="fig" role="img"></div>
  <p class="cap" data-i="figcap"></p>
 </div>
</section>

<section class="band soft" id="cay">
 <div class="wrap">
  <h2 data-i="treeH"></h2>
  <p class="intro" data-i="treeIntro"></p>
  <div class="tools">
   <div class="search"><input id="q" type="search" autocomplete="off"><div class="hits" id="hits" hidden></div></div>
   <span style="display:flex;gap:8px;align-items:center"><label class="muted" for="root" data-i="startFrom"></label><select id="root" class="sel"></select></span>
   <button class="btn main" id="bPath" data-i="bPath"></button>
   <button class="btn" id="bAll" data-i="bAll"></button>
   <button class="btn" id="bClose" data-i="bClose"></button>
   <button class="btn zb" id="zOut" aria-label="−">−</button><button class="btn zb" id="zIn" aria-label="+">+</button>
  </div>
  <div class="grid">
   <div class="chartwrap" id="cw"><div class="chart" id="chart"></div></div>
   <aside class="panel" id="panel" aria-live="polite"></aside>
  </div>
 </div>
</section>

<section class="band" id="danh-ba">
 <div class="wrap">
  <h2 data-i="dirH"></h2>
  <p class="intro" data-i="dirIntro"></p>
  <div class="tools"><div class="search"><input id="dq" type="search" autocomplete="off"></div><button class="btn main" data-start="1" data-i="cta"></button></div>
  <div class="status" id="dbStatus"></div>
  <div class="dir" id="dir"></div>
 </div>
</section>

<section class="band" id="duyet" hidden>
 <div class="wrap">
  <div class="tools" style="justify-content:space-between"><h2 id="qh"></h2><button class="btn" id="signOut" data-i="signout"></button></div>
  <p class="muted" id="adminNote"></p>
  <div class="dir" id="qlist"></div>
 </div>
</section>

<section class="band soft" id="anh">
 <div class="wrap">
  <h2 data-i="phH"></h2>
  <p class="intro" data-i="phIntro"></p>
  <div class="tools"><div class="search"><input id="gq" type="search" autocomplete="off"></div><button class="btn main" id="upBtn" data-i="upload" hidden></button><input type="file" id="fileIn" accept="image/jpeg,image/png,image/webp,image/gif" hidden></div>
  <p class="muted" id="phNote" hidden></p>
  <div class="gal" id="gal"></div>
 </div>
</section>

<dialog id="prof" class="prd"><div class="dlg" id="profBody"></div></dialog>
<dialog id="pv" class="pvd"><div class="dlg" id="pvBody"></div></dialog>

<section class="band" id="danh-nhan"><div class="wrap"><h2 data-i="peopleH"></h2><p class="intro" data-i="peopleIntro"></p><div class="people" id="people"></div></div></section>

<section class="band soft" id="nguon-goc"><div class="wrap"><h2 data-i="originH"></h2><p class="intro" data-i="originIntro"></p><ol class="route" id="route"></ol><div class="two" id="quotes"></div></div></section>

<section class="band" id="tai-lieu"><div class="wrap two" style="margin-top:0">
 <div><h2 data-i="notesH"></h2><ul class="plain" id="notes"></ul><p data-i="notesEnd"></p></div>
 <div><h2 data-i="srcH"></h2><ul class="plain src" id="srcs"></ul></div>
</div></section>

<footer class="band foot"><div class="wrap"><span data-i="foot"></span> <a href="#top" data-i="toTop"></a> · <button class="linkbtn" id="adminBtn" data-i="admin"></button></div></footer>

<!-- ===== CẤU HÌNH: dán Project URL và anon public key của Supabase vào đây ===== -->
<script>window.GP_CONFIG={url:'/*SB_URL*/',key:'/*SB_KEY*/'};</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<dialog id="dlg"><div class="dlg" id="dlgBody"></div></dialog>

<script>
{
const RAW=`b1||Nguyễn Bặc||924–979|Định Quốc Công, khai quốc công thần nhà Đinh. Tiền tổ (đời 1) dòng Nguyễn Hữu.|
b2|b1|Nguyễn Đệ|||Đô Kiểm Hiệu. Dời về Gia Miêu, Thanh Hóa.|
b3|b2|Nguyễn Viễn|||Tạ Quốc Công|

const PEOPLE=[
 ['b1','Nguyễn Bặc','924–979',1,{vi:'Định Quốc Công, khai quốc công thần nhà Đinh, giúp Đinh Bộ Lĩnh dẹp loạn 12 sứ quân và đứng đầu các công thần năm 968. Năm 979 khởi binh chống Lê Hoàn để giữ nhà Đinh, bị bắt và bị giết. Các gia phả họ Nguyễn tôn ngài làm thủy tổ; lăng ở Gia Viễn, Ninh Bình.',en:'Duke of Định Quốc and founding minister of the Đinh dynasty, he helped Đinh Bộ Lĩnh end the Twelve Warlords period and led the court from 968. In 979 he rose against Lê Hoàn to defend the Đinh house and was captured and killed. Nguyễn family records honour him as their founder; his tomb is in Gia Viễn, Ninh Bình.'}],
 ['b11','Nguyễn Trãi','1380–1442',11,{vi:'Con Nguyễn Phi Khanh, mưu sĩ của Lê Lợi trong khởi nghĩa Lam Sơn, tác giả Bình Ngô đại cáo, Ức Trai thi tập, Quốc âm thi tập. Mất trong vụ án Lệ Chi Viên. Năm 1980 được vinh danh là danh nhân văn hóa thế giới.',en:'Son of Nguyễn Phi Khanh and strategist to Lê Lợi in the Lam Sơn uprising; author of the Great Proclamation upon the Pacification of the Wu and much poetry in Chinese and Vietnamese. He died in the Lệ Chi Viên case. In 1980 he was honoured as a figure of world culture.'}],
 ['b18','Nguyễn Hữu Dật','1603–1681',18,{vi:'Chiêu Vũ hầu. Năm 1627 dùng kế ly gián khiến chúa Trịnh rút quân; cùng Đào Duy Từ đắp lũy Thầy, lũy Trường Dục; đại thắng năm 1648; giữ lũy Trấn Ninh năm 1672. Nổi tiếng nhân hậu, dân lập đền thờ gọi là Bụt Tát.',en:'Marquis Chiêu Vũ. In 1627 his ruse made the Trịnh army withdraw; with Đào Duy Từ he built the Thầy and Trường Dục walls; won a great victory in 1648 and held the Trấn Ninh wall in 1672. Known for his kindness, local people built a shrine to him.'}],

   const up=await SB.storage.from('photos').upload(path,blob,{contentType:blob.type,upsert:false});if(up.error)throw up.error;
   URLS[path]=URL.createObjectURL(blob);

   }
  }catch(x){btn.disabled=false;btn.textContent=t('upload');const m=String(x&&(x.message||x.statusCode)||'');err.textContent=/size|413|large/i.test(m)?t('eBig'):/mime|type/i.test(m)?t('eType'):t('eUpload')}
 };

function shrink(file){
 return new Promise((res,rej)=>{const img=new Image(),u=URL.createObjectURL(file);
  img.onload=()=>{const M=2000,s=Math.min(1,M/Math.max(img.naturalWidth,img.naturalHeight)),w=Math.round(img.naturalWidth*s),h=Math.round(img.naturalHeight*s);
   if(s===1&&file.size<6e6&&file.type!=='image/gif'){URL.revokeObjectURL(u);res({blob:file,w,h});return}
   const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(img,0,0,w,h);URL.revokeObjectURL(u);
   c.toBlob(b=>b?res({blob:b,w,h}):rej({code:'invalid_request'}),'image/jpeg',.88)};
  img.onerror=()=>{URL.revokeObjectURL(u);rej({code:'unsupported_type'})};img.src=u});
}

async function approve(s){
 const p=s.payload||{};let r;
 if(s.kind==='profile'){if(!P[s.target])throw new Error('target');r=await SB.from('profiles').upsert({person_id:s.target,data:cleanProf(p.profile),updated_at:new Date().toISOString()});if(r.error)throw r.error}
 else if(s.kind==='person'){const q=p.person||{};if(!P[s.target])throw new Error('parent');const row=personRow({id:okPid(q.id)?q.id:'a'+rid(),parent:s.target,name:String(q.name||'').slice(0,80),gender:q.gender==='nu'?'nu':'nam',spouse:String(q.spouse||'').slice(0,120),birthYear:String(q.birthYear||''),deathYear:String(q.deathYear||'')});
  r=await SB.from('people').upsert(row);if(r.error)throw r.error;const pr=cleanProf(p.profile);if(Object.keys(pr).length){r=await SB.from('profiles').upsert({person_id:row.id,data:pr,updated_at:new Date().toISOString()});if(r.error)throw r.error}}
 else if(s.kind==='photo'){if(!okId(p.path))throw new Error('path');r=await SB.from('photos').insert({id:'p'+rid(),path:p.path,w:num(p.w,1,20000),h:num(p.h,1,20000),caption:String(p.caption||'').slice(0,200),when_text:String(p.when||'').slice(0,80),where_text:String(p.where||'').slice(0,120),tags:[]});if(r.error)throw r.error}
 else if(s.kind==='tags'){r=await SB.from('photos').update({tags:cleanTags(p.tags)}).eq('id',s.target);if(r.error)throw r.error}
 r=await SB.from('submissions').delete().eq('id',s.id);if(r.error)throw r.error;
}
const okPid=s=>/^a[a-z0-9]{6,30}$/.test(String(s||''));
qList.addEventListener('click',async e=>{
 const ok=e.target.closest('[data-qok]'),no=e.target.closest('[data-qno]');if(!ok&&!no)return;
 const id=(ok||no).dataset[ok?'qok':'qno'],s=QUEUE.find(x=>String(x.id)===id);if(!s)return;
 const b=ok||no;b.disabled=true;
 try{
  if(ok)await approve(s);
  else{const r=await SB.from('submissions').delete().eq('id',s.id);if(r.error)throw r.error;if(s.kind==='photo'&&okId(s.payload&&s.payload.path))await SB.storage.from('photos').remove([s.payload.path])}
  await loadQueue();await loadAll();
 }catch(_){b.disabled=false;const pe=qList.querySelector(`[data-qerr="${CSS.escape(id)}"]`);if(pe)pe.textContent=t('eAct')}
});
function adminLogin(){
 if(isAdmin){qSec.scrollIntoView({behavior:'smooth'});return}
 body.innerHTML=`${X()}<h3>${t('adminH')}</h3><p class="muted">${t('adminP')}</p><form id="lf" novalidate><div class="fg"><label class="w">${t('email')}<input id="l-email" type="email" autocomplete="username"></label><label class="w">${t('password')}<input id="l-pass" type="password" autocomplete="current-password"></label></div><div class="err" id="lerr"></div><div class="acts"><button class="btn main" type="submit">${t('signin')}</button></div></form>`;
 if(!dlg.open)dlg.showModal();
 document.getElementById('lf').onsubmit=async e=>{e.preventDefault();const err=document.getElementById('lerr');err.textContent='';
  if(!SB){err.textContent=t('notConfigured');return}
  const {error}=await SB.auth.signInWithPassword({email:val('l-email'),password:document.getElementById('l-pass').value});
  if(error){err.textContent=t('eLogin');return}
  await checkAdmin();if(!isAdmin){await SB.auth.signOut();err.textContent=t('eNotAdmin');return}
  close();qSec.scrollIntoView({behavior:'smooth'})};
}
document.getElementById('adminBtn').onclick=adminLogin;
document.getElementById('signOut').onclick=async()=>{await SB.auth.signOut();isAdmin=false;canAdmin=false;qSec.hidden=true;renderGal();if(sel&&P[sel])showPanel(sel)};
pvd.addEventListener('close',()=>{if(pv.dirty&&!isAdmin){const ph=photoById(pv.id);pv.dirty=false;if(ph)submit('tags',ph.id,{tags:ph.tags}).catch(()=>{})}});

(async()=>{
 if(!/^https:\/\/[a-z0-9-]+\.supabase\.co\/?$/.test(CFG.url||'')||!/^[A-Za-z0-9._-]{20,}$/.test(CFG.key||'')||!window.supabase){dbState='notConfigured';renderDir();renderGal();return}
 SB=window.supabase.createClient(CFG.url,CFG.key);db=SB;canWrite=true;assetsNS=true;
 try{await checkAdmin()}catch(_){}
 try{await loadAll()}catch(_){dbState='failed';renderDir();renderGal()}
})();

}
</script>
